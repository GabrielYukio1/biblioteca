<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livros</title>
</head>
<body>

<h1>Cadastro de Livros</h1>

<form th:action="@{/livros}" th:object="${livro}" method="post">

    <label>Título:</label>
    <input type="text" th:field="*{titulo}" required>
    <br><br>

    <label>Autor:</label>
    <input type="text" th:field="*{autor}" required>
    <br><br>

    <label>Ano de publicação:</label>
    <input type="number" th:field="*{anoPublicacao}" required>
    <br><br>

    <button type="submit">Cadastrar Livro</button>

</form>

<br>

<a th:href="@{/livros}">Ver livros cadastrados</a>

</body>
</html>
