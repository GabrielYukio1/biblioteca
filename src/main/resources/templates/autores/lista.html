<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Autores</title>
</head>
<body>

<h1>Autores Cadastrados</h1>

<a th:href="@{/autores/novo}">Cadastrar novo autor</a>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Nacionalidade</th>
        <th>Obra conhecida</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="autor, status : ${autores}">
        <td th:text="${autor.nome}"></td>
        <td th:text="${autor.nacionalidade}"></td>
        <td th:text="${autor.obraConhecida}"></td>
        <td>
            <a th:href="@{/autores/excluir/{indice}(indice=${status.index})}"
               onclick="return confirm('Deseja realmente excluir este autor?')">
                Excluir
            </a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(autores)}">
    Nenhum autor cadastrado.
</p>

</body>
</html>
