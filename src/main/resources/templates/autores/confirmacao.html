
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmação do Cadastro</title>
</head>
<body>

<h1>Autor cadastrado com sucesso!</h1>

<h2>Dados do autor:</h2>

<p>Nome: <span th:text="${autor.nome}"></span></p>

<p>Nacionalidade: <span th:text="${autor.nacionalidade}"></span></p>

<p>Obra conhecida: <span th:text="${autor.obraConhecida}"></span></p>

<a th:href="@{/autores/novo}">Cadastrar outro autor</a>

</body>
</html>
